<!-- login.component.html -->
<div class="login-wrapper">
    <div class="auth-container">
        <div class="auth-header">
            <h2 class="auth-title">Iniciar Sesión</h2>
            <p class="auth-subtitle">Ingresa a tu cuenta para continuar</p>
        </div>

        <form class="auth-form" (ngSubmit)="onLogin()">
            <div class="form-group">
                <label class="form-label" for="email">Email</label>
                <input type="email" id="email" placeholder="Tu email" [(ngModel)]="credentials.email" name="email" class="form-input" required>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Tu contraseña" [(ngModel)]="credentials.password" name="password" class="form-input" required>
            </div>

            <div *ngIf="errorMessage" class="error-message">
                <i class="fas fa-exclamation-circle"></i>
                <span>{{ errorMessage }}</span>
            </div>

            <button type="submit" class="auth-button">Iniciar Sesión</button>

            <div class="auth-link">
                <a routerLink="/register">¿No tienes una cuenta? Regístrate ahora</a>
            </div>
        </form>
    </div>
</div>
