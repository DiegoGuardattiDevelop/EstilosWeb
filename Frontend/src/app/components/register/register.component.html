<div class="register-container">
  <div class="auth-container">
    <div class="auth-header">
      <h2 class="auth-title">Crear Cuenta</h2>
      <p class="auth-subtitle">Regístrate para comenzar a comprar</p>
    </div>

    <!-- Mensaje de error mejorado -->
    <div *ngIf="showError" class="error-message show">
      <i class="fas fa-exclamation-circle"></i>
      <span>{{ errorMessage }}</span>
      <button type="button" class="error-close" (click)="closeError()">
        <i class="fas fa-times"></i>
      </button>
    </div>

    <form class="auth-form" (ngSubmit)="onRegister()" #registerForm="ngForm">
      <div class="form-group">
        <label for="name" class="form-label">Nombre Completo</label>
        <input 
          type="text" 
          id="name" 
          [(ngModel)]="user.name" 
          name="name" 
          class="form-input"
          required
          placeholder="Tu nombre completo"
        >
      </div>

      <div class="form-group">
        <label for="email" class="form-label">Email</label>
        <input 
          type="email" 
          id="email" 
          [(ngModel)]="user.email" 
          name="email" 
          class="form-input"
          required
          placeholder="tu@email.com"
        >
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Contraseña</label>
        <input 
          type="password" 
          id="password" 
          [(ngModel)]="user.password" 
          name="password" 
          class="form-input"
          required
          placeholder="Crea una contraseña segura"
        >
      </div>

      <div class="form-group">
        <label for="password_confirmation" class="form-label">Confirmar Contraseña</label>
        <input 
          type="password" 
          id="password_confirmation" 
          [(ngModel)]="user.password_confirmation" 
          name="password_confirmation" 
          class="form-input"
          required
          placeholder="Repite tu contraseña"
        >
      </div>

      <button 
        type="submit" 
        class="auth-button" 
        [disabled]="isLoading"
      >
        {{ isLoading ? 'Creando cuenta...' : 'Crear Cuenta' }}
      </button>
    </form>

    <div class="auth-link">
      <p>¿Ya tienes una cuenta? <a routerLink="/login">Inicia sesión aquí</a></p>
    </div>
  </div>
</div>
