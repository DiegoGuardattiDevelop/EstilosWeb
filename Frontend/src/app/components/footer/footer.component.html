<footer class="footer">
  <div class="footer-container">
    <!-- Sección de Contacto -->
    <div class="footer-section">
      <h3>Contáctanos</h3>
      <div class="footer-contact">
        <div class="contact-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07 19.5 19.5 0 01-6-6A19.79 19.79 0 012.08 4.22a2 2 0 012.18-2h3a2 2 0 012 2v.5a.5.5 0 001 0V2a2 2 0 012-2h3a2 2 0 012 2v.5a.5.5 0 001 0V2a2 2 0 012-2h3a2 2 0 012 2v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63 3.07A19.5 19.5 0 013 16.93a2 2 0 01-2 2.18v3a2 2 0 012 2h3a2 2 0 012-2v-.5a.5.5 0 00-1 0V22a2 2 0 012 2h3a2 2 0 012-2v-.5a.5.5 0 00-1 0V22a2 2 0 012-2h3a2 2 0 012 2v-3a2 2 0 01-2.18-2 19.79 19.79 0 018.63-3.07A19.5 19.5 0 0121 16.93z"/>
          </svg>
          <span>+54 11 1234-5678</span>
        </div>
        <div class="contact-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <span>info@estilosweb.com</span>
        </div>
        <div class="contact-item">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 1 1 18 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
          <span>Pilar, Buenos Aires</span>
        </div>
      </div>
    </div>

    <!-- Sección de Navegación -->
    <div class="footer-section">
      <h3>Explorar</h3>
      <ul>
        <li><a routerLink="/">Inicio</a></li>
        <li><a routerLink="/products">Productos</a></li>
        <li><a routerLink="/categories">Categorías</a></li>
        <li><a routerLink="/cart">Carrito</a></li>
        <li><a routerLink="/checkout">Checkout</a></li>
      </ul>
    </div>

    <!-- Sección de Categorías -->
    <div class="footer-section">
      <h3>Categorías</h3>
      <ul>
        <li><a routerLink="/category/hombre">Hombre</a></li>
        <li><a routerLink="/category/mujer">Mujer</a></li>
        <li><a routerLink="/category/niños">Niños</a></li>
        <li><a routerLink="/category/calzado">Calzado</a></li>
        <li><a routerLink="/category/accesorios">Accesorios</a></li>
      </ul>
    </div>

    <!-- Sección de Carrito y Usuario -->
    <div class="footer-section">
      <h3>Mi Cuenta</h3>
      <div class="footer-actions">
        <button class="footer-cart-btn" (click)="openCart()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="8" cy="21" r="1"/>
            <circle cx="19" cy="21" r="1"/>
            <path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57L23 6H6"/>
          </svg>
          <span>Carrito</span>
          <span class="cart-count" *ngIf="cartItemCount > 0">{{cartItemCount}}</span>
        </button>
        
        <div class="footer-user-actions">
          <button class="footer-login-btn" *ngIf="!isAuthenticated" (click)="openLogin()">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10,17 15,12 10,7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Iniciar Sesión
          </button>
          
          <div class="footer-user-menu" *ngIf="isAuthenticated">
            <button class="footer-user-btn" (click)="toggleUserMenu()">
              <div class="footer-user-avatar">
                {{userInitials}}
              </div>
              <span>{{userName}}</span>
            </button>
            
            <div class="footer-user-dropdown" [class.open]="isUserMenuOpen">
              <button (click)="goToProfile()">Mi Perfil</button>
              <button (click)="goToOrders()">Mis Pedidos</button>
              <button (click)="logout()">Cerrar Sesión</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Sección de Redes Sociales -->
    <div class="footer-section">
      <h3>Síguenos</h3>
      <div class="social-links">
        <a href="#" class="social-link" aria-label="WhatsApp">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893A11.821 11.821 0 0020.885 3.488"/>
          </svg>
        </a>
        <a href="#" class="social-link" aria-label="Instagram">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <rect x="2" y="2" width="20" height="20" rx="5" ry="5"/>
            <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/>
            <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/>
          </svg>
        </a>
        <a href="#" class="social-link" aria-label="Facebook">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M21 2h-4a1 1 0 0 0-1 1v4H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h4v-6H7v-2h2v-1c0-2.66 1.5-4 4-4 .75 0 1.5.1 2.25.25V7.5A3.75 3.75 0 0 0 12 3.75c-1.5 0-2.75 1.25-2.75 2.75V7h-1V5.75c0-.41.34-.75.75-.75 2.25 0 4.5 1.25 4.5 3.5V11h2v2h-2v6h4a2 2 0 0 0 2-2V5a3 3 0 0 0-3-3z"/>
          </svg>
        </a>
      </div>
    </div>
  </div>

  <div class="footer-bottom">
    <p>© 2025 EstilosWeb. Todos los derechos reservados.</p>
  </div>
</footer>
